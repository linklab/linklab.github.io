required-version = "==0.17.3"
target-version = "py311"
line-length = 120
indent-width = 4
include = ["*.py", "*.pyi"]
extend-exclude = [".local-quality", "_site", "vendor"]
force-exclude = true

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "W605",
    "UP",
    "ANN",
    "A",
    "C4",
    "G",
    "SLF",
    "SIM",
    "TC",
    "PD",
    "RUF",
]
ignore = [
    "E701",
    "E702",
    "E703",
    "ANN002",
    "ANN003",
    "ANN204",
    "ANN401",
    "SIM108",
    "SIM118",
]

[lint.flake8-annotations]
mypy-init-return = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
