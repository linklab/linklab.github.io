name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Fix and check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.commit_hash || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attach source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git switch --force-create "$SOURCE_BRANCH"

      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@7e30171fc973d78099d7dfc78e27c07d3c4a639f
        with:
          version: v4.0.2

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install encoding fixer
        run: python -m pip install --disable-pip-version-check pre-commit-hooks==6.0.0

      - name: Remove UTF-8 byte order markers
        continue-on-error: true
        run: |
          editorconfig-checker -dry-run > "$RUNNER_TEMP/encoding-files"
          status=0
          while IFS= read -r file; do
            if [[ ! -L "$file" ]]; then
              fix-byte-order-marker "$file" || status=1
            fi
          done < "$RUNNER_TEMP/encoding-files"
          exit "$status"

      - name: Apply supported EditorConfig fixes
        # Commit safe fixes first; the final check still rejects remaining errors.
        continue-on-error: true
        run: editorconfig-checker -fix -format github-actions

      - name: Commit automatic fixes
        id: commit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: Fix formatting
          branch: ${{ github.head_ref || github.ref_name }}
          status_options: --untracked-files=no
          add_options: -u
          skip_fetch: true
          skip_checkout: true

      - name: Require committed fixes for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --exit-code

      - name: Check all enabled rules
        run: editorconfig-checker -format github-actions

  deploy:
    name: Deploy
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/jekyll.yml
    with:
      ref: ${{ needs.quality.outputs.sha }}
