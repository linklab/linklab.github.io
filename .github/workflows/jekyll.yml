# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Build and deploy Jekyll site

on:
  workflow_call:
    inputs:
      ref:
        description: Commit that passed the quality checks
        required: true
        type: string
      deploy:
        description: Deploy the checked build to GitHub Pages
        required: true
        type: boolean

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install linting tools
        run: npm ci --no-audit --no-fund
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2" # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        if: inputs.deploy
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check JavaScript structure
        run: npm run check:js:structure
      - name: Check CSS structure
        run: npm run check:css:structure
      - name: Check HTML structure
        run: npm run check:html:structure
      - name: Upload artifact
        if: inputs.deploy
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    if: inputs.deploy
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
