name: Update LINK member gallery photos

on:
  schedule:
    # Every Monday 03:00 UTC (= 12:00 KST)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pick new random photos from the shared album
        run: python3 scripts/update_link_gallery.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/images/members/link_gallery; then
            git add assets/images/members/link_gallery
            git commit -m "Refresh LINK member gallery photos"
            git push
          else
            echo "No change in gallery photos."
          fi
